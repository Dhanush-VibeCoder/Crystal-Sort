#bal{position:absolute;left:22px;top:180px;height:70px;min-width:200px;padding:0 26px 0 18px;display:flex;align-items:center;gap:14px;border:2px solid #c9a24a;border-radius:20px;background:linear-gradient(#10123a,#0a0b27);box-shadow:0 0 0 3px #0b0c2a,0 0 0 4px #c9a24a55,0 0 18px #5a3cff44;transition:box-shadow .3s}
#bal .gm{width:34px;height:38px}#bal small{display:block;font-size:13px;letter-spacing:3px;color:#c9a24a}#bal b{font-size:34px;font-weight:600;color:#f6ead0;line-height:1.05}
#bal.bump{box-shadow:0 0 0 3px #0b0c2a,0 0 0 4px #ffd36a,0 0 34px #b07cff}
#rw{position:absolute;left:76px;top:848px;width:84px;height:42px;border-radius:12px;background:#05071a;box-shadow:0 0 10px 6px #05071a;display:flex;align-items:center;justify-content:center;gap:10px;font-size:32px;color:#f2e6c4}
#rw .gm{width:26px;height:30px}

.ov{background:radial-gradient(#0b0c33cc,#02010ce6)}
.ov .panel{padding:36px 60px 40px;min-width:500px;font-size:24px;color:#e9e4ff;border:2px solid #c9a24a;border-radius:28px;background:linear-gradient(#15184f,#0a0b27 70%);box-shadow:0 0 0 4px #0b0c2a,0 0 0 5px #c9a24a66,0 0 60px #5a3cffaa,inset 0 0 40px #000a;animation:pin .28s ease-out}
@keyframes pin{from{transform:scale(.9);opacity:0}}
.ov .panel:before{content:"";position:absolute;inset:9px;border:1px solid #c9a24a55;border-radius:20px;pointer-events:none}
.ov h3{font-size:38px;font-weight:500;letter-spacing:5px;text-transform:uppercase;color:#f6ead0;margin:0}
.ov h3:before,.ov h3:after{content:"◆";font-size:14px;color:#c9a24a;vertical-align:middle;margin:0 16px}
.dv{height:1px;margin:14px auto 22px;width:80%;background:linear-gradient(90deg,transparent,#c9a24a,transparent);position:relative}
.dv:after{content:"";position:absolute;left:50%;top:-4px;width:8px;height:8px;background:#c9a24a;transform:translateX(-50%) rotate(45deg)}
.ov .sub{font-size:20px;color:#bfb3e8;margin-bottom:6px}
.r2{display:flex;justify-content:space-between;align-items:center;gap:40px;padding:12px 4px;border-bottom:1px solid #c9a24a33;text-align:left;font-size:23px;letter-spacing:1px}
.gold{color:#f5d98c;display:inline-flex;align-items:center;gap:8px;font-size:26px}.gold .gm{width:20px;height:23px}
.sw{width:70px;height:34px;border-radius:17px;border:2px solid #c9a24a;background:#0a0b27;position:relative;cursor:pointer;transition:.2s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#8a86b8;transition:.2s}
.sw.on{background:#3a2a9a;box-shadow:0 0 14px #7a5cff}.sw.on:after{left:39px;background:#ffe9a8}
.x{position:absolute;right:22px;top:16px;width:38px;height:38px;border:1px solid #c9a24a88;border-radius:12px;line-height:36px;font-size:20px;color:#e9d9a8;cursor:pointer;text-align:center}.x:hover{background:#ffffff14}
.btn{background:linear-gradient(#171947,#0a0b27);border:2px solid #c9a24a;border-radius:16px;color:#f0e3c0;letter-spacing:3px;text-transform:uppercase;font-size:21px;padding:13px 34px;margin:26px 8px 0}
.btn.pri{background:linear-gradient(#4b2fc4,#241670);box-shadow:0 0 18px #7a5cff88;color:#fff}

#chest{width:220px;height:170px;margin:26px auto 2px;position:relative}
#lid{transform-origin:40px 85px;transition:transform .55s cubic-bezier(.3,1.7,.5,1)}
#crays,#cglow,#cin{transition:opacity .4s}
#crays{transform-origin:110px 85px;animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#chest.open #lid{transform:rotate(-42deg)}#chest.open #crays{opacity:.85!important}#chest.open #cglow,#chest.open #cin{opacity:1!important}
#chest.shake{animation:shk .55s}@keyframes shk{20%{transform:translateX(-5px) rotate(-3deg)}40%{transform:translateX(5px) rotate(3deg)}60%{transform:translateX(-4px) rotate(-2deg)}80%{transform:translateX(4px) rotate(2deg)}}

#rwp{display:none;position:absolute;left:344px;top:88px;width:362px;height:54px;align-items:center;justify-content:center;gap:14px;border:2px solid #c9a24a;border-radius:18px;background:linear-gradient(#10123a,#0a0b27);box-shadow:0 0 0 3px #0b0c2a,0 0 0 4px #c9a24a55}
#rwp small{font-size:14px;letter-spacing:3px;color:#c9a24a}#rwp b{font-size:28px;color:#f6ead0}#rwp .gm{width:22px;height:25px}
.p #goal,.p #rw{display:none}.p #rwp{display:flex}
.p #bal{left:344px;top:16px;width:362px;height:62px;min-width:0;justify-content:center}
.p #title{left:155px;top:156px}
.p #board{left:5px;top:calc(500px + var(--dy)*.5);transform:scale(.74);transform-origin:0 0}
.p #pw{left:20px;top:auto;bottom:128px;width:680px;height:176px;background:none;display:flex;gap:14px}

<script>
const COL=['#19e6ff','#9b4dff','#ff2a1f','#2f6bff','#ffc21a','#ff3fc4','#22e05a','#ff8a1f','#e8f4ff','#b6ff2a','#00ffa6','#ff7a7a'],CAP=4,$=id=>document.getElementById(id);
let S={lv:1,gems:50,best:{},snd:true},T=[],sel=-1,moves=0,hist=[],free=3,added=false,locked=false;
try{Object.assign(S,JSON.parse(localStorage.getItem('crystalsort')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('crystalsort',JSON.stringify(S))}catch(e){}};
const rewardFor=l=>l<6?3:l<15?5:8;let lastWin=null,shown=null;
function tw(el,from,to){const t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/800);el.textContent=Math.round(from+(to-from)*k);if(k<1)requestAnimationFrame(f)})(t0)}
function updBal(){const el=$('balv'),to=S.gems;if(shown===null||shown==to){shown=to;el.textContent=to;return}const from=shown,b=$('bal');shown=to;b.classList.add('bump');setTimeout(()=>b.classList.remove('bump'),900);tw(el,from,to)}
let ac;function beep(f,d=.1){if(!S.snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.setValueAtTime(.08,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
let SW=1400,SH=1120,PORT=false;
function fit(){const W=innerWidth,H=innerHeight,port=W/H<.85,st=$('stage'),nw=port?720:1400,nh=port?Math.round(Math.max(1200,Math.min(1560,720*H/W))):1120;
 if(port!=PORT||nw!=SW||nh!=SH){PORT=port;SW=nw;SH=nh;st.classList.toggle('p',port);st.style.width=SW+'px';st.style.height=SH+'px';st.style.setProperty('--dy',Math.max(0,SH-1280)+'px');const cv=$('fx');cv.width=SW/2;cv.height=SH/2;cv.style.width=SW+'px';cv.style.height=SH+'px';cv.getContext('2d').setTransform(.5,0,0,.5,0,0);if(T.length)render()}
 document.querySelectorAll('.tb').forEach((e,i)=>{e.style.left=(port?[60,230,400,570][i]:[925,1045,1161,1275][i])+'px';e.style.top=port?'352px':'26px'});

addEventListener('resize',fit);
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;clearTimeout(e.t);e.t=setTimeout(()=>e.style.opacity=0,1400)}
function gen(){const n=Math.min(12,3+Math.ceil(S.lv/2));let t;do{const p=[];for(let i=0;i<n;i++)for(let k=0;k<CAP;k++)p.push(i);p.sort(()=>Math.random()-.5);t=[];for(let i=0;i<n;i++)t.push(p.slice(i*CAP,i*CAP+CAP));t.push([],[])}while(t.some(x=>x.length&&x.every(c=>c==x[0])));return t}
