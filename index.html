 if(k=='lv'){const mx=S.max||S.lv;let c='',tot=0;for(let n=1;n<=100;n++){const st=(S.stars&&S.stars[n])||0,lk=n>mx;tot+=st;c+=`<div class="lc${lk?' lk':''}${n==S.lv?' cur':''}"${lk?'':` onclick="pickLv(${n})"`}><b>${lk?'🔒':n}</b><i>${lk?'':[0,1,2].map(j=>`<u class="${j<st?'on':''}">★</u>`).join('')}</i></div>`}
  p.innerHTML=`<b class="x" onclick="cl()">✕</b>${hd(t('levels'))}<p class="sub">★ ${tot} / 300</p><div class="lg">${c}</div>`;setTimeout(()=>{const q=document.querySelector('.lc.cur');q&&q.scrollIntoView({block:'center'})},30)}
 if(k=='win'){const w=lastWin,b=HB(),canR=b&&PGOK&&w.R>0&&!w.dbl&&(()=>{try{return b.advertisement.isRewardedSupported}catch(e){return false}})();
  p.innerHTML=`<b class="x" onclick="nextLv()">✕</b>${CH}${hd(t('lvDone',w.L))}<div class="stars">${[1,2,3].map(k=>`<span class="${k<=w.st?'on':''}" style="animation-delay:${.15*k+.1}s">★</span>`).join('')}</div><div class="r2"><span>${t('movesL')}</span><span class="gold">${w.m}</span></div><div class="r2"><span>${t('parL')}</span><span class="gold">${w.par}</span></div><div class="r2"><span>${t('rewardL')}</span><span class="gold"><i class="gm"></i>+${w.R}</span></div><div class="r2"><span>${t('totalL')}</span><span class="gold"><i class="gm" id="wtg"></i><b id="wt">${S.gems-w.R}</b></span></div>${canR?`<button class="btn" id="dbl" onclick="watchDouble()">${t('dbl')}</button>`:''}<button class="btn pri" onclick="nextLv()">${t('next')}</button>`;setTimeout(()=>chestAnim(w.R,S.gems-w.R),500)}}
function nextLv(){cl();const L=lastWin?lastWin.L:0;if(L>=3)showAd(()=>start());else start()}
function cl(){$('o').classList.remove('on');pgMsg('level_resumed')}
function warm(){try{COL.forEach(h=>{const r=[1,3,5].map(k=>parseInt(h.slice(k,k+2),16));spr(r,0);spr(r,1)});const cx=$('fx').getContext('2d');cx.fillRect(0,0,1,1);cx.clearRect(0,0,SW,SH);const d=document.createElement('div');d.style.cssText='position:absolute;left:-200px;top:0;width:84px;height:80px';d.innerHTML='<i class="c" style="--i:0;--v:0"></i>';$('stage').appendChild(d);requestAnimationFrame(()=>d.remove())}catch(e){}}
function pgMsg(m,d){try{const b=HB();if(b&&PGOK)b.platform.sendMessage(m,d)}catch(e){}}
function pgSetup(){const b=HB();if(!b||!PGOK)return;
 try{LANG=String(b.platform.language||LANG||'en').toLowerCase().slice(0,2)}catch(e){}
 try{pgAudio=b.platform.isAudioEnabled!==false}catch(e){}
 try{const E=b.EVENT_NAME;b.platform.on(E.AUDIO_STATE_CHANGED,v=>{pgAudio=v!==false;auApply()});b.platform.on(E.PAUSE_STATE_CHANGED,p=>{pgPaused=!!p;auPause()})}catch(e){}
 try{const E=b.EVENT_NAME;b.advertisement.on(E.INTERSTITIAL_STATE_CHANGED,st=>adH&&adH(String(st)));b.advertisement.on(E.REWARDED_STATE_CHANGED,st=>rwH&&rwH(String(st)));b.advertisement.setMinimumDelayBetweenInterstitial&&b.advertisement.setMinimumDelayBetweenInterstitial(60)}catch(e){}}
function showAd(next){const b=HB();let sup=false;try{sup=!!(b&&PGOK&&b.advertisement.isInterstitialSupported)}catch(e){}
 if(!sup||adBusy){next();return}
 let done=false,opened=false;const fin=()=>{if(done)return;done=true;adH=null;adBusy=false;auApply();auPause();next()};
 adH=st=>{if(st=='opened'){opened=true;adBusy=true;auApply()}else if(st=='closed'||st=='failed')fin()};
 try{b.advertisement.showInterstitial('level_complete')}catch(e){fin();return}
 setTimeout(()=>{if(!opened)fin()},4000);setTimeout(fin,90000)}
function watchDouble(){const b=HB(),w=lastWin;if(!b||!w||w.dbl)return;const btn=$('dbl');if(btn)btn.disabled=true;let got=false,done=false;
 const fin=()=>{if(done)return;done=true;rwH=null;adBusy=false;auApply();auPause();if(btn){got?btn.remove():btn.disabled=false}};
 rwH=st=>{if(st=='opened'){adBusy=true;auApply()}else if(st=='rewarded'){if(!got){got=true;w.dbl=true;S.gems+=w.R;save();const e=$('wt');e&&(e.textContent=S.gems);sfx('ping',6)}}else if(st=='closed'||st=='failed')fin()};
 try{b.advertisement.showRewarded('double_reward')}catch(e){fin();return}
 setTimeout(()=>{if(!adBusy&&!got)fin()},4000);setTimeout(fin,120000)}
function boot(){let fin=false;const go=()=>{if(fin)return;fin=true;applyLang();fit();applyCb();start();setTimeout(warm,350);requestAnimationFrame(()=>requestAnimationFrame(()=>pgMsg('game_ready')))};
 setTimeout(go,4500);const b=HB();
 if(!b){try{applySave(localStorage.getItem('crystalsort'))}catch(e){}go();return}
 b.initialize().then(()=>{PGOK=true;return b.storage.get(['crystalsort'])}).then(d=>{if(!fin)applySave(d&&d[0])}).catch(()=>{if(!fin){try{applySave(localStorage.getItem('crystalsort'))}catch(e){}}}).then(()=>{if(!fin)pgSetup();go()})}
boot();
</script></body></html>
